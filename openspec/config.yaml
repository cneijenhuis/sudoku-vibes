schema: spec-driven

context: |
  Browser-based, mobile-first Sudoku game written in TypeScript.
  Minimise dependencies: zero runtime dependencies; dev dependencies limited
  to Vite, TypeScript and Vitest. UI is plain DOM, no framework.
  Deployed as a static site to GitHub Pages (served from a sub-path, so all
  asset URLs must be relative / use Vite's base).
  Touch is the primary input: touch targets >= 44px, no double-tap zoom,
  no text selection or context menu on long-press, respect safe-area insets.
  Six difficulty levels: Super Easy, Easy, Medium, Hard, Extreme, Almost Impossible.
  Generated puzzles must always have exactly one solution.
  The app is called "Sudoku Vibes" and has a light "Summer Vibes" theme (beach photo on the page
  canvas, frosted glass surfaces, Fredoka, self-hosted assets so it works offline). It runs as an
  installed iOS/Android home-screen app, where the viewport can be shorter than the screen.

